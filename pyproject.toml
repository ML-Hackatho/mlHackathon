[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap-person1"
version = "0.1.0"
description = "PathSnap data exploration, feature pipeline, and two baseline rankers"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "folium>=0.15",
  "joblib>=1.3",
  "matplotlib>=3.9",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "optuna>=4.3",
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[project.scripts]
pathsnap-eda = "pathsnap_person1.eda:main"
pathsnap-train-baselines = "pathsnap_person1.training:main"
pathsnap-candidate-coverage = "pathsnap_person1.coverage:main"
pathsnap-export-candidates = "pathsnap_person1.export_candidates:main"
pathsnap-train-person2 = "pathsnap_person2.training:main"
pathsnap-export-oof = "pathsnap_person2.oof:main"
pathsnap-tune-decoder = "pathsnap_person2.decoder_tuning:main"
pathsnap-api = "pathsnap_person2.api:main"

[tool.setuptools.packages.find]
where = ["src"]
